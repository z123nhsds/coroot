name: Release

on:
  release:
    types: [created]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  VERSION: ${{ github.event.release.tag_name }}

jobs:
  build-frontend:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ./front/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
      - run: npm ci
      - run: npm version ${{ env.VERSION }}
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build-prod
      - uses: actions/upload-artifact@v4
        with:
          name: static
          path: ./static

  build-images:
    needs: build-frontend
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64, linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            
      - name: extract amd64 binary from the image
        run: |
          docker create --platform linux/amd64 --name amd64 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} && 
          docker cp amd64:/usr/bin/coroot /tmp/coroot-amd64

      - name: extract arm64 binary from the image
        run: |
          docker create --platform linux/arm64 --name arm64 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} &&
          docker cp arm64:/usr/bin/coroot /tmp/coroot-arm64

      - name: compute binary digests
        id: digests
        run: |
          AMD64_SHA256=$(sha256sum /tmp/coroot-amd64 | cut -d' ' -f1)
          ARM64_SHA256=$(sha256sum /tmp/coroot-arm64 | cut -d' ' -f1)
          echo "amd64_sha256=${AMD64_SHA256}" >> "$GITHUB_OUTPUT"
          echo "arm64_sha256=${ARM64_SHA256}" >> "$GITHUB_OUTPUT"

      - name: generate SLSA3 provenance
        uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.0.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          digest: ${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
        secrets:
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: generate binary SLSA3 provenance
        run: |
          cat > /tmp/provenance.json <<EOF
          {
            "_type": "https://in-toto.io/Statement/v1",
            "predicateType": "https://slsa.dev/provenance/v1",
            "subject": [
              {
                "uri": "https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/coroot-amd64",
                "digest": { "sha256": "${{ steps.digests.outputs.amd64_sha256 }}" }
              },
              {
                "uri": "https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/coroot-arm64",
                "digest": { "sha256": "${{ steps.digests.outputs.arm64_sha256 }}" }
              }
            ],
            "predicate": {
              "buildDefinition": {
                "buildType": "https://slsa.dev/github-actions-buildtype/v1",
                "externalParameters": {
                  "repository": "git+https://github.com/${{ github.repository }}",
                  "ref": "${{ github.ref }}",
                  "sha": "${{ github.sha }}",
                  "workflow": {
                    "path": ".github/workflows/release.yml",
                    "reference": "${{ github.ref }}"
                  }
                },
                "internalParameters": {
                  "github_actor": "${{ github.actor }}",
                  "runner_os": "linux",
                  "runner_arch": "x64",
                  "runner_environment": "github-hosted"
                },
                "resolvedDependencies": [
                  {
                    "uri": "git+https://github.com/${{ github.repository }}",
                    "digest": { "sha1": "${{ github.sha }}" }
                  }
                ]
              },
              "runDetails": {
                "builder": {
                  "id": "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}"
                },
                "metadata": {
                  "invocationID": "${{ github.run_id }}",
                  "startedOn": "${{ github.event.repository.updated_at }}",
                  "finishedOn": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                }
              }
            }
          }
          EOF
          sed -i "s/\$(date -u +%Y-%m-%dT%H:%M:%SZ)/$(date -u +%Y-%m-%dT%H:%M:%SZ)/" /tmp/provenance.json

      - name: upload amd64 binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: /tmp/coroot-amd64
          asset_name: coroot-amd64
          asset_content_type: application/octet-stream

      - name: upload arm64 binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: /tmp/coroot-arm64
          asset_name: coroot-arm64
          asset_content_type: application/octet-stream

      - name: upload provenance
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: /tmp/provenance.json
          asset_name: provenance.json
          asset_content_type: application/json

      - uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ github.event.release.id }}
        with:
          script: |
            const { RELEASE_ID } = process.env
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: `${RELEASE_ID}`,
              prerelease: false,
              make_latest: true
            })
